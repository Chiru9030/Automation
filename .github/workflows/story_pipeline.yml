name: Autonomous Daily Story Video Pipeline

on:
  schedule:
    # 6 premier high-curiosity viral drops per day (spaced every 3 hours across waking hours):
    # Explicit distinct cron entries guarantee GitHub's scheduler registers isolated triggers
    - cron: '17 1 * * *'   # 01:17 UTC -> 06:47 AM IST (Early Morning Wake-up & Commute Drop)
    - cron: '17 4 * * *'   # 04:17 UTC -> 09:47 AM IST (Morning Work/Study Tea Break)
    - cron: '17 7 * * *'   # 07:17 UTC -> 12:47 PM IST (Lunchtime Viral Peak)
    - cron: '17 10 * * *'  # 10:17 UTC -> 03:47 PM IST (Afternoon Slump Recharge)
    - cron: '17 13 * * *'  # 13:17 UTC -> 06:47 PM IST (Evening Commute & Prime Relaxation)
    - cron: '17 16 * * *'  # 16:17 UTC -> 09:47 PM IST (Bedtime Viral Scrolling Feed)
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Custom Topic or Story Idea (Leave blank for autonomous generation)'
        required: false
        default: ''
      sample_mode:
        description: 'Run in Sample Mode (Render & Audit without publishing to YouTube/Instagram)'
        type: boolean
        required: false
        default: false
      privacy_status:
        description: 'YouTube Privacy Status (public, unlisted, or private)'
        type: choice
        options:
          - public
          - unlisted
          - private
        default: 'public'

concurrency:
  group: story-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Ensure System Fonts
        run: |
          sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core || true

      - name: Cache Python Dependencies
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Node Modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: video-app/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('video-app/package.json') }}

      - name: Install Remotion NPM Packages
        if: steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: ./video-app
        run: npm install --prefer-offline --no-audit

      - name: Unpack Social Media Auth Tokens (If provided)
        run: |
          if [ -n "${{ secrets.YOUTUBE_TOKENS }}" ]; then
            echo '${{ secrets.YOUTUBE_TOKENS }}' > youtube_tokens.json
            echo "✅ Configured YouTube OAuth token"
          fi
          if [ -n "${{ secrets.IG_SESSION }}" ]; then
            echo '${{ secrets.IG_SESSION }}' > instagram_session.json
            echo "✅ Configured Instagram session"
          fi

      - name: Run Autonomous Story Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
          SAMPLE_MODE: ${{ github.event.inputs.sample_mode }}
          YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy_status || 'public' }}
          RENDER_ENGINE: fast
          PYTHONUNBUFFERED: "1"
        run: |
          python3 story_runner.py

      - name: Upload Generated Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-episode-mp4
          path: video-app/out/**/*.mp4
          retention-days: 1

      - name: Upload Generated Thumbnail Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-thumbnail-jpg
          path: video-app/out/**/*.jpg
          retention-days: 1

      - name: Prune Stale GitHub Artifacts (Quota Shield)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import subprocess, json
          try:
              out = subprocess.check_output(['gh', 'api', 'repos/${{ github.repository }}/actions/artifacts', '--paginate'], text=True)
              data = json.loads(out)
              artifacts = data.get('artifacts', [])
              # Retain only the latest 2 sets of artifacts to keep GitHub cloud storage strictly bounded
              if len(artifacts) > 4:
                  for art in artifacts[4:]:
                      art_id = art['id']
                      subprocess.run(['gh', 'api', '-X', 'DELETE', f'repos/${{ github.repository }}/actions/artifacts/{art_id}'], check=False)
                      print(f'Purged historical artifact {art_id} ({art.get(\"name\")})')
          except Exception as e:
              print(f'Artifact prune note: {e}')
          " || true

      - name: Commit Updated Story History
        run: |
          git config --global user.name "Story Automation Bot"
          git config --global user.email "bot@storypipeline.internal"
          git add story_pipeline/story_history.json story_pipeline/backlog_queue.json
          git commit -m "Auto: advanced story episode history and backlog queue [skip ci]" || echo "No changes to commit"
          git push origin main || echo "⚠️ Git push history skipped"
